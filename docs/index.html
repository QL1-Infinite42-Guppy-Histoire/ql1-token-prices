<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QL1 Token Prices & Market Caps (Infinite-Anchored)</title>
<meta name="description" content="Prices and market caps for every QL1 token, derived from QomSwap liquidity pools against a QOM price tracked on the 42 Chain (Infinite) side.">
<script>(function(){try{document.documentElement.dataset.theme=localStorage.getItem("guppy-theme")==="dark"?"dark":"light";}catch(e){document.documentElement.dataset.theme="light";}})();</script>
<link rel="stylesheet" href="style.css?v=2">
<script>
/* Language gate: a saved choice (ql1prices_lang = "ja") goes to the
   Japanese page; anything else — including no saved choice — defaults to
   English. The language can be changed later with the selector in each
   page's header. Query/hash are preserved so shared watchlist links
   (?w=…) keep working through the gate. */
(function () {
  var lang = null;
  try { lang = localStorage.getItem("ql1prices_lang"); } catch (e) { /* storage unavailable: default English */ }
  location.replace((lang === "ja" ? "ja.html" : "en.html") + location.search + location.hash);
})();
</script>
</head>
<body>
<header>
  <h1>QL1 Token Prices & Market Caps</h1>
  <p class="sub">Choose your language / 言語を選んでください</p>
  <p class="sub"><a href="en.html">English</a> ・ <a href="ja.html">日本語</a></p>
  <noscript><p class="sub">JavaScript is disabled — please use the links above. / JavaScript が無効です。上のリンクからお進みください。</p></noscript>
</header>
</body>
</html>
